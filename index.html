<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧮 Math Master</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0e;
  --card:#1a1a1a;
  --card2:#222;
  --accent:#f0c040;
  --green:#00e676;
  --red:#ff3d57;
  --blue:#40c4ff;
  --purple:#ce93d8;
  --dim:#555;
  --text:#f0f0f0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}
body{position:fixed;width:100%;}

/* BG grid effect */
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(240,192,64,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(240,192,64,.03) 1px,transparent 1px);
  background-size:40px 40px;
  pointer-events:none;z-index:0;
}

/* SCREENS */
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:1;}
.screen.active{display:flex;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* ======== HOME SCREEN ======== */
#homeScreen{background:radial-gradient(ellipse at 50% 0%,rgba(240,192,64,.12),transparent 70%),var(--bg);}

.home-logo{
  font-family:'Space Mono',monospace;
  font-size:clamp(2.8rem,10vw,5rem);
  font-weight:700;
  color:var(--accent);
  text-shadow:0 0 30px rgba(240,192,64,.5),0 0 60px rgba(240,192,64,.2);
  margin-bottom:8px;
  animation:logoPulse 2s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{text-shadow:0 0 30px rgba(240,192,64,.5),0 0 60px rgba(240,192,64,.2);}50%{text-shadow:0 0 50px rgba(240,192,64,.8),0 0 100px rgba(240,192,64,.4);}}

.home-sub{font-size:clamp(1rem,3vw,1.3rem);color:var(--dim);letter-spacing:3px;text-transform:uppercase;margin-bottom:40px;font-family:'Space Mono',monospace;}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:420px;margin-bottom:30px;}

.mode-card{
  background:var(--card);
  border:2px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:20px 15px;
  cursor:pointer;
  transition:all .25s;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.mode-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s;}
.mode-card:active{transform:scale(.95);}
.mode-card:active::before{opacity:1;}

.mode-card.easy::before{background:radial-gradient(circle at center,rgba(0,230,118,.15),transparent 70%);}
.mode-card.easy{border-color:rgba(0,230,118,.3);}
.mode-card.easy:hover{border-color:var(--green);box-shadow:0 0 25px rgba(0,230,118,.25);}

.mode-card.medium::before{background:radial-gradient(circle at center,rgba(64,196,255,.15),transparent 70%);}
.mode-card.medium{border-color:rgba(64,196,255,.3);}
.mode-card.medium:hover{border-color:var(--blue);box-shadow:0 0 25px rgba(64,196,255,.25);}

.mode-card.hard::before{background:radial-gradient(circle at center,rgba(240,192,64,.15),transparent 70%);}
.mode-card.hard{border-color:rgba(240,192,64,.3);}
.mode-card.hard:hover{border-color:var(--accent);box-shadow:0 0 25px rgba(240,192,64,.25);}

.mode-card.extreme::before{background:radial-gradient(circle at center,rgba(255,61,87,.15),transparent 70%);}
.mode-card.extreme{border-color:rgba(255,61,87,.3);}
.mode-card.extreme:hover{border-color:var(--red);box-shadow:0 0 25px rgba(255,61,87,.25);}

.mode-icon{font-size:2.5rem;margin-bottom:8px;display:block;}
.mode-name{font-size:1rem;font-weight:900;margin-bottom:4px;}
.mode-desc{font-size:.75rem;color:var(--dim);font-family:'Space Mono',monospace;}
.mode-card.easy .mode-name{color:var(--green);}
.mode-card.medium .mode-name{color:var(--blue);}
.mode-card.hard .mode-name{color:var(--accent);}
.mode-card.extreme .mode-name{color:var(--red);}

.high-scores{
  background:var(--card);border:1px solid rgba(255,255,255,.06);
  border-radius:16px;padding:15px 20px;width:100%;max-width:420px;
}
.hs-title{font-family:'Space Mono',monospace;font-size:.75rem;color:var(--dim);letter-spacing:2px;margin-bottom:10px;text-align:center;}
.hs-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.hs-row:last-child{border-bottom:none;}
.hs-mode{font-size:.85rem;font-weight:700;}
.hs-val{font-family:'Space Mono',monospace;font-size:.9rem;color:var(--accent);}

/* ======== GAME SCREEN ======== */
#gameScreen{
  background:var(--bg);
  justify-content:flex-start;
  padding:0;
}

.game-header{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;
  background:rgba(0,0,0,.5);
  border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.hdr-score{font-family:'Space Mono',monospace;}
.hdr-score-label{font-size:.65rem;color:var(--dim);letter-spacing:1px;}
.hdr-score-val{font-size:1.6rem;font-weight:700;color:var(--accent);}
.hdr-combo{text-align:center;}
.combo-label{font-size:.65rem;color:var(--dim);letter-spacing:1px;}
.combo-val{font-size:1.4rem;font-weight:900;transition:all .2s;}
.combo-val.hot{color:var(--red);animation:comboShake .3s ease;}
@keyframes comboShake{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}
.hdr-lives{display:flex;gap:4px;align-items:center;justify-content:flex-end;}
.heart{font-size:1.2rem;transition:all .2s;}
.heart.lost{opacity:.2;transform:scale(.7);}

/* Timer bar */
.timer-wrap{width:100%;height:8px;background:rgba(255,255,255,.08);flex-shrink:0;}
.timer-bar{
  height:100%;
  background:linear-gradient(90deg,var(--green),var(--accent));
  transition:width .1s linear,background .5s;
  border-radius:0 4px 4px 0;
}
.timer-bar.urgent{background:linear-gradient(90deg,var(--red),#ff8a00);animation:urgentFlash .5s ease-in-out infinite;}
@keyframes urgentFlash{0%,100%{opacity:1;}50%{opacity:.6;}}

/* Main game area */
.game-body{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:15px;gap:20px;overflow:hidden;
}

/* Level badge */
.level-badge{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  padding:6px 16px;border-radius:20px;
  font-size:.8rem;font-family:'Space Mono',monospace;color:var(--dim);
}
.level-badge .lv-num{color:var(--accent);font-weight:700;}

/* Question card */
.q-card{
  width:100%;max-width:500px;
  background:var(--card);
  border:2px solid rgba(255,255,255,.1);
  border-radius:28px;
  padding:30px 25px 25px;
  text-align:center;
  position:relative;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.q-card::after{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at center,rgba(240,192,64,.04),transparent 60%);
  pointer-events:none;
}
.q-type{
  font-size:.7rem;font-family:'Space Mono',monospace;
  color:var(--dim);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:15px;
}
.q-text{
  font-family:'Space Mono',monospace;
  font-size:clamp(1.8rem,6vw,3rem);
  font-weight:700;color:white;
  line-height:1.3;margin-bottom:8px;
  animation:qAppear .3s ease;
}
@keyframes qAppear{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.q-hint{font-size:.8rem;color:var(--dim);font-style:italic;}

/* Answer options */
.answers-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  width:100%;max-width:500px;
}
.ans-btn{
  background:var(--card);
  border:2px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:16px 12px;
  font-family:'Space Mono',monospace;
  font-size:clamp(.9rem,3vw,1.1rem);
  font-weight:700;
  color:var(--text);
  cursor:pointer;
  transition:all .18s;
  position:relative;
  overflow:hidden;
}
.ans-btn:active{transform:scale(.94);}
.ans-btn:hover{background:var(--card2);border-color:rgba(240,192,64,.4);}
.ans-btn.correct{
  background:rgba(0,230,118,.2);border-color:var(--green);color:var(--green);
  animation:correctPop .4s ease;
}
.ans-btn.wrong{
  background:rgba(255,61,87,.2);border-color:var(--red);color:var(--red);
  animation:wrongShake .4s ease;
}
.ans-btn.reveal{background:rgba(0,230,118,.15);border-color:rgba(0,230,118,.4);}
@keyframes correctPop{0%{transform:scale(1);}40%{transform:scale(1.08);}100%{transform:scale(1);}}
@keyframes wrongShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}

/* Streak / XP bar */
.xp-row{width:100%;max-width:500px;display:flex;align-items:center;gap:10px;}
.xp-label{font-size:.7rem;color:var(--dim);font-family:'Space Mono',monospace;white-space:nowrap;}
.xp-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
.xp-bar{height:100%;background:linear-gradient(90deg,var(--purple),var(--accent));border-radius:3px;transition:width .4s ease;}
.xp-val{font-size:.75rem;font-family:'Space Mono',monospace;color:var(--purple);white-space:nowrap;}

/* Floating score popup */
.score-pop{
  position:fixed;
  font-family:'Space Mono',monospace;
  font-size:1.4rem;font-weight:700;
  pointer-events:none;z-index:999;
  animation:popUp .9s ease forwards;
}
@keyframes popUp{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-80px) scale(.5);opacity:0;}}

/* ======== RESULT SCREEN ======== */
#resultScreen{background:radial-gradient(ellipse at 50% 30%,rgba(240,192,64,.1),transparent 60%),var(--bg);}

.result-card{
  background:var(--card);border:2px solid rgba(240,192,64,.3);
  border-radius:28px;padding:35px 25px;
  width:100%;max-width:440px;text-align:center;
  box-shadow:0 0 60px rgba(240,192,64,.15);
  animation:resultBoom .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes resultBoom{from{transform:scale(.4) rotate(-8deg);opacity:0;}to{transform:scale(1) rotate(0);opacity:1;}}

.result-grade{font-size:5rem;margin-bottom:10px;}
.result-title{font-family:'Space Mono',monospace;font-size:1.8rem;font-weight:700;color:var(--accent);margin-bottom:20px;}
.result-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:25px;}
.rs-box{background:rgba(255,255,255,.05);border-radius:14px;padding:14px;}
.rs-label{font-size:.7rem;color:var(--dim);letter-spacing:1px;margin-bottom:5px;font-family:'Space Mono',monospace;}
.rs-val{font-size:1.5rem;font-weight:900;}
.rs-val.score{color:var(--accent);}
.rs-val.correct{color:var(--green);}
.rs-val.combo{color:var(--red);}
.rs-val.time{color:var(--blue);}

.btn-again{
  width:100%;background:linear-gradient(135deg,var(--accent),#e0a800);
  color:#000;border:none;padding:16px;border-radius:16px;
  font-size:1.1rem;font-weight:900;cursor:pointer;
  font-family:'Space Mono',monospace;letter-spacing:1px;
  transition:all .2s;margin-bottom:10px;
}
.btn-again:active{transform:scale(.97);}
.btn-home{
  width:100%;background:transparent;
  border:2px solid rgba(255,255,255,.1);color:var(--dim);padding:14px;border-radius:16px;
  font-size:.95rem;font-weight:700;cursor:pointer;font-family:'Space Mono',monospace;
  transition:all .2s;
}
.btn-home:active{transform:scale(.97);}

/* ======== LANG ======== */
.lang-grp{position:fixed;top:14px;right:14px;z-index:100;display:flex;gap:4px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);padding:4px;border-radius:14px;}
.lb{background:transparent;border:none;padding:5px 10px;border-radius:10px;color:var(--dim);font-weight:700;font-size:11px;cursor:pointer;font-family:'Space Mono',monospace;}
.lb.active{background:rgba(240,192,64,.2);color:var(--accent);}

/* ======== RESPONSIVE ======== */
@media(max-width:380px){
  .mode-grid{grid-template-columns:1fr 1fr;gap:8px;}
  .mode-card{padding:15px 10px;}
  .mode-icon{font-size:2rem;}
  .ans-btn{padding:13px 8px;font-size:.85rem;}
  .q-text{font-size:1.6rem;}
}
</style>
</head>
<body>

<div class="lang-grp">
  <button class="lb active" data-lang="uz">UZ</button>
  <button class="lb" data-lang="ru">RU</button>
  <button class="lb" data-lang="en">EN</button>
</div>

<!-- HOME -->
<div class="screen active" id="homeScreen">
  <div class="home-logo">∑ MATH</div>
  <div class="home-sub" data-i18n="subtitle">MASTER</div>

  <div class="mode-grid">
    <div class="mode-card easy" data-mode="easy">
      <span class="mode-icon">🌱</span>
      <div class="mode-name" data-i18n="easy">Oson</div>
      <div class="mode-desc">+−×÷</div>
    </div>
    <div class="mode-card medium" data-mode="medium">
      <span class="mode-icon">⚡</span>
      <div class="mode-name" data-i18n="medium">O'rta</div>
      <div class="mode-desc">Kasr, %</div>
    </div>
    <div class="mode-card hard" data-mode="hard">
      <span class="mode-icon">🔥</span>
      <div class="mode-name" data-i18n="hard">Qiyin</div>
      <div class="mode-desc">Daraja, √</div>
    </div>
    <div class="mode-card extreme" data-mode="extreme">
      <span class="mode-icon">💀</span>
      <div class="mode-name" data-i18n="extreme">Ekstremal</div>
      <div class="mode-desc">Algebra</div>
    </div>
  </div>

  <div class="high-scores">
    <div class="hs-title" data-i18n="records">— ENG YUQORI NATIJALAR —</div>
    <div class="hs-row"><span class="hs-mode" style="color:var(--green)" data-i18n="easy">Oson</span><span class="hs-val" id="hs-easy">---</span></div>
    <div class="hs-row"><span class="hs-mode" style="color:var(--blue)" data-i18n="medium">O'rta</span><span class="hs-val" id="hs-medium">---</span></div>
    <div class="hs-row"><span class="hs-mode" style="color:var(--accent)" data-i18n="hard">Qiyin</span><span class="hs-val" id="hs-hard">---</span></div>
    <div class="hs-row"><span class="hs-mode" style="color:var(--red)" data-i18n="extreme">Ekstremal</span><span class="hs-val" id="hs-extreme">---</span></div>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="gameScreen">
  <div class="game-header">
    <div class="hdr-score">
      <div class="hdr-score-label" data-i18n="score">BALL</div>
      <div class="hdr-score-val" id="scoreVal">0</div>
    </div>
    <div class="hdr-combo">
      <div class="combo-label">COMBO</div>
      <div class="combo-val" id="comboVal">×1</div>
    </div>
    <div>
      <div class="hdr-score-label" style="text-align:right" data-i18n="lives">HAYOT</div>
      <div class="hdr-lives" id="livesRow">
        <span class="heart">❤️</span>
        <span class="heart">❤️</span>
        <span class="heart">❤️</span>
      </div>
    </div>
  </div>
  <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>

  <div class="game-body">
    <div class="level-badge"><span data-i18n="level">DARAJA</span> <span class="lv-num" id="levelNum">1</span> &nbsp;|&nbsp; <span id="qNum">1</span>/20</div>

    <div class="q-card">
      <div class="q-type" id="qType">ARIFMETIKA</div>
      <div class="q-text" id="qText">2 + 2 = ?</div>
      <div class="q-hint" id="qHint"></div>
    </div>

    <div class="answers-grid" id="answersGrid"></div>

    <div class="xp-row">
      <span class="xp-label" data-i18n="progress">PROGRESS</span>
      <div class="xp-bar-wrap"><div class="xp-bar" id="xpBar" style="width:0%"></div></div>
      <span class="xp-val" id="xpVal">0 XP</span>
    </div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="resultScreen">
  <div class="result-card">
    <div class="result-grade" id="resultGrade">🏆</div>
    <div class="result-title" id="resultTitle">AJOYIB!</div>
    <div class="result-stats">
      <div class="rs-box"><div class="rs-label" data-i18n="score">BALL</div><div class="rs-val score" id="rScore">0</div></div>
      <div class="rs-box"><div class="rs-label" data-i18n="correct">TO'G'RI</div><div class="rs-val correct" id="rCorrect">0/20</div></div>
      <div class="rs-box"><div class="rs-label">MAX COMBO</div><div class="rs-val combo" id="rCombo">×1</div></div>
      <div class="rs-box"><div class="rs-label" data-i18n="time">VAQT</div><div class="rs-val time" id="rTime">0s</div></div>
    </div>
    <button class="btn-again" id="btnAgain" data-i18n="again">QAYTA BOSHLASH</button>
    <button class="btn-home" id="btnHome" data-i18n="home">← BOSH SAHIFA</button>
  </div>
</div>

<script>
// ── TRANSLATIONS ──────────────────────────────────────────
const T={
  uz:{subtitle:"MASTER",easy:"Oson",medium:"O'rta",hard:"Qiyin",extreme:"Ekstremal",records:"— ENG YUQORI NATIJALAR —",score:"BALL",lives:"HAYOT",level:"DARAJA",progress:"PROGRESS",correct:"TO'G'RI",time:"VAQT",again:"QAYTA BOSHLASH",home:"← BOSH SAHIFA",
    grades:{S:"USTOZ! 🎓",A:"AJOYIB! 🌟",B:"YAXSHI! 👍",C:"YOMON EMAS 😐",D:"KO'PROQ MASHQ 💪"},
    types:{arith:"ARIFMETIKA",frac:"KASR",power:"DARAJALAR",algebra:"ALGEBRA",percent:"FOIZ",sqrt:"ILDIZ"}
  },
  ru:{subtitle:"МАСТЕР",easy:"Лёгкий",medium:"Средний",hard:"Сложный",extreme:"Экстрим",records:"— РЕКОРДЫ —",score:"ОЧКИ",lives:"ЖИЗНИ",level:"УРОВЕНЬ",progress:"ПРОГРЕСС",correct:"ВЕРНО",time:"ВРЕМЯ",again:"ИГРАТЬ СНОВА",home:"← ГЛАВНАЯ",
    grades:{S:"ГЕНИЙ! 🎓",A:"ОТЛИЧНО! 🌟",B:"ХОРОШО! 👍",C:"НЕПЛОХО 😐",D:"ТРЕНИРУЙСЯ 💪"},
    types:{arith:"АРИФМЕТИКА",frac:"ДРОБИ",power:"СТЕПЕНИ",algebra:"АЛГЕБРА",percent:"ПРОЦЕНТЫ",sqrt:"КОРЕНЬ"}
  },
  en:{subtitle:"MASTER",easy:"Easy",medium:"Medium",hard:"Hard",extreme:"Extreme",records:"— HIGH SCORES —",score:"SCORE",lives:"LIVES",level:"LEVEL",progress:"PROGRESS",correct:"CORRECT",time:"TIME",again:"PLAY AGAIN",home:"← HOME",
    grades:{S:"GENIUS! 🎓",A:"AMAZING! 🌟",B:"GOOD! 👍",C:"NOT BAD 😐",D:"KEEP TRYING 💪"},
    types:{arith:"ARITHMETIC",frac:"FRACTIONS",power:"POWERS",algebra:"ALGEBRA",percent:"PERCENT",sqrt:"SQUARE ROOT"}
  }
};
let lang='uz';
function setLang(l){
  lang=l;
  document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=T[l][el.dataset.i18n];if(v)el.textContent=v;});
}
document.querySelectorAll('.lb').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));

// ── AUDIO ──────────────────────────────────────────────────
const AC=new(window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,type='sine',vol=.15){
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
  o.start();o.stop(AC.currentTime+dur);
}
function playCorrect(){beep(600,.1);setTimeout(()=>beep(900,.15),80);}
function playWrong(){beep(200,.3,'sawtooth',.1);}
function playCombo(){beep(800,.08);setTimeout(()=>beep(1000,.08),60);setTimeout(()=>beep(1200,.12),120);}
function playLevelUp(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*80));}
function playGameOver(){[400,350,300,250].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*100));}

// ── QUESTION GENERATORS ────────────────────────────────────
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function choice(arr){return arr[rand(0,arr.length-1)];}
function shuffle(arr){return arr.sort(()=>Math.random()-.5);}

function genEasy(){
  const ops=['+','-','×','÷'];
  const op=choice(ops);
  let a,b,ans,text;
  if(op==='+'){a=rand(1,50);b=rand(1,50);ans=a+b;text=`${a} + ${b} = ?`;}
  else if(op==='-'){a=rand(10,80);b=rand(1,a);ans=a-b;text=`${a} − ${b} = ?`;}
  else if(op==='×'){a=rand(2,12);b=rand(2,12);ans=a*b;text=`${a} × ${b} = ?`;}
  else{a=rand(2,12);b=rand(2,12);ans=a;a=ans*b;text=`${a} ÷ ${b} = ?`;}
  return{text,ans,type:'arith',hint:''};
}

function genMedium(){
  const t=rand(0,3);
  if(t===0){// fraction
    const d=choice([2,4,5,8,10]);
    const n1=rand(1,d-1),n2=rand(1,d-1);
    const sum=(n1+n2);
    return{text:`${n1}/${d} + ${n2}/${d} = ?`,ans:sum%d===0?sum/d:`${sum}/${d}`,type:'frac',hint:`Denominators same = add numerators`};
  }
  if(t===1){// percent
    const base=choice([10,20,25,40,50,100,200]);
    const pct=choice([10,20,25,50,75]);
    const ans=base*pct/100;
    return{text:`${pct}% of ${base} = ?`,ans,type:'percent',hint:''};
  }
  if(t===2){// two-step
    const a=rand(2,15),b=rand(2,10),c=rand(1,20);
    const ans=a*b+c;
    return{text:`${a}×${b} + ${c} = ?`,ans,type:'arith',hint:''};
  }
  // negative
  const a=rand(1,20),b=rand(a+1,a+30);
  return{text:`${a} − ${b} = ?`,ans:a-b,type:'arith',hint:''};
}

function genHard(){
  const t=rand(0,3);
  if(t===0){// powers
    const b=rand(2,8),e=rand(2,4);
    return{text:`${b}${e===2?'²':e===3?'³':'⁴'} = ?`,ans:Math.pow(b,e),type:'power',hint:`${b}^${e}`};
  }
  if(t===1){// sqrt
    const sq=choice([4,9,16,25,36,49,64,81,100,121,144]);
    return{text:`√${sq} = ?`,ans:Math.sqrt(sq),type:'sqrt',hint:'Perfect square'};
  }
  if(t===2){// order of ops
    const a=rand(2,10),b=rand(2,8),c=rand(1,15);
    const ans=a+b*c;
    return{text:`${a} + ${b} × ${c} = ?`,ans,type:'arith',hint:'BODMAS: × before +'};
  }
  // mixed fraction
  const whole=rand(1,5),num=rand(1,4),den=choice([2,3,4,5]);
  const ans=whole+num/den;
  const ansWhole=Math.floor(ans),ansNum=(ans-ansWhole)*den;
  const ansTxt=ansNum===0?`${ansWhole}`:`${ansWhole} ${ansNum}/${den}`;
  return{text:`${whole} + ${num}/${den} = ?`,ans:ansTxt,type:'frac',hint:''};
}

function genExtreme(){
  const t=rand(0,3);
  if(t===0){// algebra: solve x
    const a=rand(2,10),b=rand(1,20),c=rand(b+1,b+50);
    const ans=(c-b);
    return{text:`${a}x + ${b} = ${a*ans+b}\nx = ?`,ans,type:'algebra',hint:'Isolate x'};
  }
  if(t===1){// quadratic result
    const x=rand(1,8);
    return{text:`x² − ${2*x}x + ${x*x} = 0\nx = ?`,ans:x,type:'algebra',hint:'(x−a)² = 0'};
  }
  if(t===2){// complex order
    const a=rand(2,6),b=rand(2,5),c=rand(1,8),d=rand(1,10);
    const ans=a*b+c*d;
    return{text:`(${a}×${b}) + (${c}×${d}) = ?`,ans,type:'arith',hint:''};
  }
  // percentage complex
  const base=rand(100,500);
  const pct=choice([12,15,17.5,22,33]);
  const ans=Math.round(base*pct/100*10)/10;
  return{text:`${pct}% of ${base} = ?`,ans,type:'percent',hint:'Estimate → exact'};
}

const GENERATORS={easy:genEasy,medium:genMedium,hard:genHard,extreme:genExtreme};
const TIME_LIMITS={easy:15,medium:12,hard:10,extreme:8};
const TOTAL_Q=20;

// ── GAME STATE ─────────────────────────────────────────────
let state={
  mode:'easy',score:0,lives:3,combo:0,maxCombo:1,
  qIndex:0,correct:0,xp:0,
  startTime:0,elapsed:0,
  timerInterval:null,timeLeft:0,
  answered:false,currentQ:null
};

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Load high scores
function loadHS(){
  ['easy','medium','hard','extreme'].forEach(m=>{
    const v=localStorage.getItem('mathhs_'+m);
    const el=document.getElementById('hs-'+m);
    if(el)el.textContent=v?v+' pts':'---';
  });
}
function saveHS(mode,score){
  const prev=parseInt(localStorage.getItem('mathhs_'+mode)||0);
  if(score>prev)localStorage.setItem('mathhs_'+mode,score);
}

// ── START GAME ─────────────────────────────────────────────
function startGame(mode){
  if(AC.state==='suspended')AC.resume();
  state={mode,score:0,lives:3,combo:0,maxCombo:1,qIndex:0,correct:0,xp:0,startTime:Date.now(),elapsed:0,timerInterval:null,timeLeft:0,answered:false,currentQ:null};
  showScreen('gameScreen');
  updateHeader();
  nextQuestion();
}

function nextQuestion(){
  if(state.qIndex>=TOTAL_Q){endGame();return;}
  state.answered=false;
  state.currentQ=GENERATORS[state.mode]();
  const q=state.currentQ;

  document.getElementById('qType').textContent=T[lang].types[q.type]||q.type.toUpperCase();
  document.getElementById('qText').textContent=q.text;
  document.getElementById('qHint').textContent=q.hint||'';
  document.getElementById('levelNum').textContent=Math.floor(state.qIndex/5)+1;
  document.getElementById('qNum').textContent=state.qIndex+1;

  // Generate wrong answers
  const ans=q.ans;
  let wrongs=[];
  if(typeof ans==='number'){
    let tries=0;
    while(wrongs.length<3&&tries<50){
      tries++;
      let w;
      const r=rand(0,3);
      if(r===0)w=ans+rand(1,Math.max(2,Math.round(Math.abs(ans)*.3)||3));
      else if(r===1)w=ans-rand(1,Math.max(2,Math.round(Math.abs(ans)*.3)||3));
      else if(r===2)w=Math.round(ans*1.5);
      else w=Math.round(ans*.5);
      if(w!==ans&&!wrongs.includes(w))wrongs.push(w);
    }
  }else{
    // string answer - make plausible alternatives
    wrongs=['?','N/A','∞'];
  }

  const opts=shuffle([{v:ans.toString(),correct:true},...wrongs.slice(0,3).map(w=>({v:w.toString(),correct:false}))]);
  
  const grid=document.getElementById('answersGrid');
  grid.innerHTML='';
  opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='ans-btn';
    btn.textContent=opt.v;
    btn.addEventListener('click',()=>answer(btn,opt.correct));
    grid.appendChild(btn);
  });

  // Timer
  clearInterval(state.timerInterval);
  state.timeLeft=TIME_LIMITS[state.mode];
  updateTimerBar();
  state.timerInterval=setInterval(()=>{
    state.timeLeft-=.1;
    updateTimerBar();
    if(state.timeLeft<=0){
      clearInterval(state.timerInterval);
      if(!state.answered)timeOut();
    }
  },100);
}

function updateTimerBar(){
  const pct=(state.timeLeft/TIME_LIMITS[state.mode])*100;
  const bar=document.getElementById('timerBar');
  bar.style.width=Math.max(0,pct)+'%';
  bar.classList.toggle('urgent',state.timeLeft<4);
}

function answer(btn,isCorrect){
  if(state.answered)return;
  state.answered=true;
  clearInterval(state.timerInterval);

  const allBtns=document.querySelectorAll('.ans-btn');

  if(isCorrect){
    btn.classList.add('correct');
    state.combo++;
    if(state.combo>state.maxCombo)state.maxCombo=state.combo;
    const multiplier=Math.min(state.combo,5);
    const basePoints=10*(Math.floor(state.qIndex/5)+1);
    const timeBonus=Math.round(state.timeLeft*2);
    const total=basePoints*multiplier+timeBonus;
    state.score+=total;
    state.correct++;
    state.xp+=total;
    playCorrect();
    if(state.combo>=3)playCombo();
    spawnScorePop(btn,`+${total}`,state.combo>=3?'#ff3d57':'#00e676');
  }else{
    btn.classList.add('wrong');
    // Reveal correct
    allBtns.forEach(b=>{if(b.textContent===state.currentQ.ans.toString())b.classList.add('reveal');});
    state.combo=0;
    state.lives--;
    playWrong();
    updateLives();
    if(state.lives<=0){setTimeout(()=>endGame(),800);return;}
  }

  updateHeader();
  if((state.qIndex+1)%5===0&&state.qIndex>0)playLevelUp();

  state.qIndex++;
  setTimeout(()=>{
    allBtns.forEach(b=>{b.classList.remove('correct','wrong','reveal');});
    nextQuestion();
  },700);
}

function timeOut(){
  state.answered=true;
  state.combo=0;
  state.lives--;
  playWrong();
  const allBtns=document.querySelectorAll('.ans-btn');
  allBtns.forEach(b=>{if(b.textContent===state.currentQ.ans.toString())b.classList.add('reveal');});
  updateHeader();
  updateLives();
  if(state.lives<=0){setTimeout(()=>endGame(),800);return;}
  state.qIndex++;
  setTimeout(()=>{
    allBtns.forEach(b=>b.classList.remove('reveal'));
    nextQuestion();
  },800);
}

function updateHeader(){
  document.getElementById('scoreVal').textContent=state.score;
  const cv=document.getElementById('comboVal');
  cv.textContent=`×${Math.min(state.combo+1,5)}`;
  cv.classList.toggle('hot',state.combo>=3);
  // XP bar
  const xpNeeded=TOTAL_Q*10*(Math.floor(state.qIndex/5)+1)*3;
  document.getElementById('xpBar').style.width=Math.min(100,(state.xp/xpNeeded)*100)+'%';
  document.getElementById('xpVal').textContent=state.xp+' XP';
}

function updateLives(){
  const hearts=document.querySelectorAll('.heart');
  hearts.forEach((h,i)=>{h.classList.toggle('lost',i>=state.lives);});
}

function spawnScorePop(el,text,color){
  const r=el.getBoundingClientRect();
  const p=document.createElement('div');
  p.className='score-pop';p.textContent=text;p.style.color=color;
  p.style.left=(r.left+r.width/2-20)+'px';
  p.style.top=(r.top-10)+'px';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),950);
}

function endGame(){
  clearInterval(state.timerInterval);
  state.elapsed=Math.round((Date.now()-state.startTime)/1000);
  playGameOver();
  saveHS(state.mode,state.score);
  loadHS();

  const pct=state.correct/TOTAL_Q;
  let grade,gradeKey;
  if(pct>=.95)gradeKey='S';
  else if(pct>=.80)gradeKey='A';
  else if(pct>=.65)gradeKey='B';
  else if(pct>=.50)gradeKey='C';
  else gradeKey='D';

  const grades={S:'🏆',A:'🌟',B:'💪',C:'😅',D:'📚'};
  document.getElementById('resultGrade').textContent=grades[gradeKey];
  document.getElementById('resultTitle').textContent=T[lang].grades[gradeKey];
  document.getElementById('rScore').textContent=state.score;
  document.getElementById('rCorrect').textContent=`${state.correct}/${TOTAL_Q}`;
  document.getElementById('rCombo').textContent=`×${state.maxCombo}`;
  document.getElementById('rTime').textContent=state.elapsed+'s';

  showScreen('resultScreen');
}

// ── MODE CARDS ─────────────────────────────────────────────
document.querySelectorAll('.mode-card').forEach(card=>{
  card.addEventListener('click',()=>startGame(card.dataset.mode));
});

// ── RESULT BUTTONS ─────────────────────────────────────────
document.getElementById('btnAgain').addEventListener('click',()=>startGame(state.mode));
document.getElementById('btnHome').addEventListener('click',()=>{showScreen('homeScreen');loadHS();});

// ── INIT ───────────────────────────────────────────────────
setLang('uz');
loadHS();
</script>
</body>
